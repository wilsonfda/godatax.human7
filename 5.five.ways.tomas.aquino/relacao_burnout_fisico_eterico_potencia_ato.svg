  <text x="1465" y="431" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fff">POTÊNCIA</text><text x="1710" y="431" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fff">ATO</text>
