  <text x="920" y="901" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1765a9">CONTEXTO E CORPO</text><text x="920" y="928" text-anchor="middle" font-family="Arial" font-size="18" fill="#174776">indicadores corporais e relatos, quando disponíveis</text>
