<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="800" y="70" text-anchor="middle" font-size="36" font-weight="700" fill="#1A1F36">Model 2 — Community Detection</text>
  <text x="800" y="105" text-anchor="middle" font-size="19" fill="#5B6478">Do structural clusters agree with the septenary / chakra framework?</text>

  <!-- Left panel: structural communities -->
  <g transform="translate(90,160)">
    <rect width="560" height="470" rx="14" fill="#FAFAFC" stroke="#E1E4EA" stroke-width="2"/>
    <text x="280" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1F36">Structural Communities</text>
    <text x="280" y="64" text-anchor="middle" font-size="14.5" fill="#5B6478">found by Louvain — no labels used</text>

    <!-- mini graph: edges first -->
    <g stroke="#D6DAE3" stroke-width="2.5">
      <line x1="120" y1="140" x2="220" y2="120" />
      <line x1="220" y1="120" x2="320" y2="160" />
      <line x1="120" y1="140" x2="100" y2="240" />
      <line x1="220" y1="120" x2="220" y2="230" />
      <line x1="320" y1="160" x2="380" y2="250" />
      <line x1="100" y1="240" x2="220" y2="230" />
      <line x1="220" y1="230" x2="380" y2="250" />
      <line x1="100" y1="240" x2="160" y2="360" />
      <line x1="220" y1="230" x2="300" y2="380" />
      <line x1="380" y1="250" x2="300" y2="380" />
      <line x1="160" y1="360" x2="300" y2="380" />
    </g>
    <!-- community X (slate): n1,n2,n4 -->
    <circle cx="120" cy="140" r="15" fill="#475569"/>
    <circle cx="220" cy="120" r="15" fill="#475569"/>
    <circle cx="100" cy="240" r="15" fill="#475569"/>
    <!-- community Y (teal): n3,n5,n6 -->
    <circle cx="320" cy="160" r="15" fill="#0F766E"/>
    <circle cx="220" cy="230" r="15" fill="#0F766E"/>
    <circle cx="380" cy="250" r="15" fill="#0F766E"/>
    <!-- community Z (brown): n7,n8 -->
    <circle cx="160" cy="360" r="15" fill="#92400E"/>
    <circle cx="300" cy="380" r="15" fill="#92400E"/>

    <!-- legend -->
    <g transform="translate(70,430)">
      <circle cx="0" cy="0" r="8" fill="#475569"/><text x="16" y="5" font-size="13.5" fill="#3A4152">Community X</text>
      <circle cx="150" cy="0" r="8" fill="#0F766E"/><text x="166" y="5" font-size="13.5" fill="#3A4152">Community Y</text>
      <circle cx="300" cy="0" r="8" fill="#92400E"/><text x="316" y="5" font-size="13.5" fill="#3A4152">Community Z</text>
    </g>
  </g>

  <!-- center compare symbol -->
  <g transform="translate(760,360)">
    <circle cx="40" cy="40" r="40" fill="#EEF1F6" stroke="#C7CCDA" stroke-width="2"/>
    <text x="40" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#5B6478">?</text>
  </g>

  <!-- Right panel: septenary/chakra levels (same nodes, same edges, colored by level) -->
  <g transform="translate(950,160)">
    <rect width="560" height="470" rx="14" fill="#FAFAFC" stroke="#E1E4EA" stroke-width="2"/>
    <text x="280" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1F36">Septenary / Chakra Levels</text>
    <text x="280" y="64" text-anchor="middle" font-size="14.5" fill="#5B6478">same nodes, colored by the framework's labels</text>

    <g stroke="#D6DAE3" stroke-width="2.5">
      <line x1="120" y1="140" x2="220" y2="120" />
      <line x1="220" y1="120" x2="320" y2="160" />
      <line x1="120" y1="140" x2="100" y2="240" />
      <line x1="220" y1="120" x2="220" y2="230" />
      <line x1="320" y1="160" x2="380" y2="250" />
      <line x1="100" y1="240" x2="220" y2="230" />
      <line x1="220" y1="230" x2="380" y2="250" />
      <line x1="100" y1="240" x2="160" y2="360" />
      <line x1="220" y1="230" x2="300" y2="380" />
      <line x1="380" y1="250" x2="300" y2="380" />
      <line x1="160" y1="360" x2="300" y2="380" />
    </g>
    <!-- Astral/gold: n1,n2,n3,n6 (spans communities X and Y) -->
    <circle cx="120" cy="140" r="15" fill="#CA8A04"/>
    <circle cx="220" cy="120" r="15" fill="#CA8A04"/>
    <circle cx="320" cy="160" r="15" fill="#CA8A04"/>
    <circle cx="380" cy="250" r="15" fill="#CA8A04"/>
    <!-- Higher Mental/blue: n4,n5,n7 (spans communities X, Y and Z) -->
    <circle cx="100" cy="240" r="15" fill="#2563EB"/>
    <circle cx="220" cy="230" r="15" fill="#2563EB"/>
    <circle cx="160" cy="360" r="15" fill="#2563EB"/>
    <!-- Buddhic/indigo: n8 -->
    <circle cx="300" cy="380" r="15" fill="#3730A3"/>

    <g transform="translate(20,430)">
      <circle cx="0" cy="0" r="8" fill="#CA8A04"/><text x="16" y="5" font-size="13.5" fill="#3A4152">Astral</text>
      <circle cx="95" cy="0" r="8" fill="#2563EB"/><text x="111" y="5" font-size="13.5" fill="#3A4152">Higher Mental</text>
      <circle cx="255" cy="0" r="8" fill="#3730A3"/><text x="271" y="5" font-size="13.5" fill="#3A4152">Buddhic</text>
    </g>
  </g>

  <!-- outcome callouts -->
  <g transform="translate(70,655)" font-size="15">
    <circle cx="10" cy="6" r="6" fill="#16A34A"/>
    <text x="26" y="11" fill="#1A1F36" font-weight="700">Match</text>
    <text x="90" y="11" fill="#5B6478">— a community is one solid level color → validates that part of the mapping.</text>
  </g>
  <g transform="translate(70,685)" font-size="15">
    <circle cx="10" cy="6" r="6" fill="#D97706"/>
    <text x="26" y="11" fill="#1A1F36" font-weight="700">Community spans levels</text>
    <text x="272" y="11" fill="#5B6478">— e.g. Community X mixes Astral (gold) and Higher Mental (blue).</text>
  </g>
  <g transform="translate(70,715)" font-size="15">
    <circle cx="10" cy="6" r="6" fill="#DC2626"/>
    <text x="26" y="11" fill="#1A1F36" font-weight="700">Level splits across communities</text>
    <text x="300" y="11" fill="#5B6478">— e.g. Astral (gold) appears in both Community X and Community Y.</text>
  </g>

  <!-- Caveat banner -->
  <g transform="translate(70,760)">
    <rect width="1460" height="90" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
    <g transform="translate(30,20)">
      <polygon points="25,3 48,45 2,45" fill="#EF4444"/>
      <text x="25" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">!</text>
    </g>
    <text x="100" y="35" font-size="17.5" font-weight="700" fill="#991B1B">Caveat: clusters are structural, not causal</text>
    <text x="100" y="60" font-size="14.5" fill="#7F1D1D">A mismatch is a prompt to investigate the construct definitions — not proof the septenary framework is wrong.</text>
  </g>

  <text x="800" y="875" text-anchor="middle" font-size="14" fill="#9AA3B2">GDX_HUMAN / 10.gdx.machine.learning — see Septenary_Link_Prediction_and_Community_Detection.md for full detail</text>
</svg>
